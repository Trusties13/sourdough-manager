name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches manifest
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/sourdough_manager/manifest.json"))["version"])')
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
