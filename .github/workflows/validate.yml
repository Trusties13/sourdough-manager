name: Validate

on:
  push:
  pull_request:

jobs:
  repository_policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_repository_policy.py
      - name: Verify repository remains public
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = "public"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install homeassistant pytest ruff pyyaml
      - run: ruff check .
      - run: pytest
      - name: Validate JSON and YAML examples
        run: |
          python -m json.tool custom_components/sourdough_manager/manifest.json >/dev/null
          python -m json.tool custom_components/sourdough_manager/strings.json >/dev/null
          python -m json.tool custom_components/sourdough_manager/translations/en.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path("examples").glob("*.yaml"):
              yaml.safe_load(path.read_text())
          PY
