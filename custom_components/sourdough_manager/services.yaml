record_feed:
  name: Record feed
  description: Record a feeding now or at an earlier time.
  fields:
    config_entry_id:
      name: Starter
      description: The Sourdough Manager configuration entry ID.
      required: true
      selector:
        config_entry:
          integration: sourdough_manager
    fed_at:
      name: Fed at
      description: Optional feeding time. Leave empty to use the current time.
      required: false
      selector:
        datetime:
