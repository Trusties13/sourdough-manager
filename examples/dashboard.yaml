# These mixed entity prefixes match the original Main Starter installation.
# Older entities retained `main_starter`; newer entities use
# `kitchen_main_starter`.
type: grid
columns: 1
square: false
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          ## 🫙 Main Starter

          {% if is_state('sensor.kitchen_main_starter_schedule_status', 'holiday_push_suppressed') %}
            ✈️ **Holiday mode — push reminders paused**
          {% elif is_state('sensor.kitchen_main_starter_schedule_status', 'holiday') %}
            ✈️ **Holiday mode — all reminders paused**
          {% elif is_state('binary_sensor.kitchen_main_starter_feed_due', 'on') %}
            🔴 **Feeding is overdue**
          {% elif is_state('binary_sensor.kitchen_main_starter_feed_due_soon', 'on') %}
            🟠 **Feeding is due soon**
          {% else %}
            🟢 **Starter is on schedule**
          {% endif %}

          {% set next_feed = states('sensor.kitchen_main_starter_next_feed_due') %}
          {% if next_feed not in ['unknown', 'unavailable', 'none'] %}
            **Next feed:** {{ as_timestamp(next_feed) | timestamp_custom('%A, %-d %B at %-I:%M %p', true) }}
          {% endif %}

      - type: conditional
        conditions:
          - entity: binary_sensor.main_starter_feed_due
            state: "on"
        card:
          type: tile
          entity: sensor.main_starter_next_feed_due
          name: Feed overdue
          icon: mdi:alert-circle
          color: red
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.kitchen_main_starter_fed_now

      - type: conditional
        conditions:
          - entity: binary_sensor.main_starter_feed_due
            state: "off"
          - entity: binary_sensor.main_starter_feed_due_soon
            state: "on"
        card:
          type: tile
          entity: sensor.main_starter_next_feed_due
          name: Feed due soon
          icon: mdi:clock-alert-outline
          color: amber
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.kitchen_main_starter_fed_now

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.main_starter_last_fed
            name: Last fed
            icon: mdi:clock-check-outline
          - type: tile
            entity: sensor.main_starter_next_feed_due
            name: Next feed
            icon: mdi:calendar-clock
          - type: tile
            entity: select.main_starter_storage_location
            name: Storage
          - type: tile
            entity: switch.kitchen_main_starter_reminders
            name: Reminders
            icon: mdi:bell-ring-outline
          - type: tile
            entity: sensor.kitchen_main_starter_schedule_status
            name: Schedule
            icon: mdi:calendar-check
          - type: tile
            entity: sensor.kitchen_main_starter_missed_feed_count
            name: Missed feeds
            icon: mdi:calendar-alert
          - type: tile
            entity: sensor.kitchen_main_starter_next_reminder
            name: Next reminder
            icon: mdi:bell-clock-outline
          - type: tile
            entity: switch.kitchen_main_starter_silent_until_next_feed
            name: Silent until feed
            icon: mdi:bell-off-outline

      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.main_starter_fed_now
            name: Fed now
            icon: mdi:check-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.kitchen_main_starter_fed_now
          - type: button
            entity: button.kitchen_main_starter_snooze_reminders
            name: Snooze
            icon: mdi:bell-sleep
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.kitchen_main_starter_snooze_reminders
          - type: button
            entity: button.kitchen_main_starter_feed_and_refrigerate
            name: Feed and refrigerate
            icon: mdi:fridge
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.kitchen_main_starter_feed_and_refrigerate

      - type: conditional
        conditions:
          - entity: binary_sensor.kitchen_main_starter_feed_due_today
            state: "on"
        card:
          type: entities
          title: Adjust today's feed
          show_header_toggle: false
          entities:
            - entity: select.kitchen_main_starter_delay_duration
              name: Delay by
            - entity: button.kitchen_main_starter_delay_next_feed
              name: Apply one-off delay
            - entity: datetime.kitchen_main_starter_next_feed_deadline
              name: Choose another date and time

      - type: conditional
        conditions:
          - entity: binary_sensor.main_starter_feed_due
            state: "on"
          - entity: binary_sensor.kitchen_main_starter_feed_due_today
            state: "off"
        card:
          type: entities
          title: Reschedule overdue feed
          show_header_toggle: false
          entities:
            - entity: select.kitchen_main_starter_delay_duration
              name: Delay by
            - entity: button.kitchen_main_starter_delay_next_feed
              name: Apply one-off delay
            - entity: datetime.kitchen_main_starter_next_feed_deadline
              name: Choose another date and time

      - type: calendar
        title: Feeding schedule
        entities:
          - calendar.kitchen_main_starter_feeding_calendar
        initial_view: listWeek

      - type: markdown
        content: |
          ## Recent feeds
          {% set feeds = state_attr('sensor.kitchen_main_starter_feed_history', 'feeds') or [] %}
          {% if feeds %}
            {% for feed in (feeds | reverse | list)[:5] %}
              - {{ as_timestamp(feed.fed_at) | timestamp_custom('%A, %-d %B at %-I:%M %p', true) }} — {{ 'Fridge' if feed.location == 'refrigerator' else 'Bench' }}
            {% endfor %}
          {% else %}
            No feeds have been recorded yet.
          {% endif %}

      - type: entities
        title: Reminder controls
        show_header_toggle: false
        entities:
          - entity: switch.kitchen_main_starter_reminders
            name: Scheduled reminders
          - entity: switch.kitchen_main_starter_push_reminders
            name: Push reminders
          - entity: switch.kitchen_main_starter_audio_reminders
            name: Audio reminders
          - entity: switch.kitchen_main_starter_light_reminders
            name: Light reminders
          - entity: switch.kitchen_main_starter_silent_until_next_feed
            name: Silent until next feed
          - entity: select.kitchen_main_starter_snooze_duration
            name: Snooze duration
          - entity: button.kitchen_main_starter_test_push_reminder
            name: Test push and light
          - entity: button.kitchen_main_starter_test_audio_reminder
            name: Test audio and light

      - type: entities
        title: Correct a late entry
        show_header_toggle: false
        entities:
          - entity: date.kitchen_main_starter_last_fed_date
            name: Last fed date
          - entity: time.kitchen_main_starter_last_fed_time
            name: Last fed time
